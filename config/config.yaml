samples:
  - 101_DEN084Y5_15_E01_008_clean
  - 101_DEN084Y5_15_E03_009_clean
  - 101_DEN084Y5_15_E05_010_clean

paths:
  raw_dir: "data/raw"
  reference_dir: "data/reference"
  processed_dir: "data/processed"
  reports_dir: "reports"

compensation_matrix: "data/reference/den_comp.csv"

transform:
  method: "arcinh"
  cofactor: 200

gating:
  viability_channel: "Aqua Amine FLR-A"
  viability_threshold: 1.3
  lineage_channel: "CD3 APC-H7 FLR-A"
  lineage_threshold: 1.75
  cd4_channel: "CD4 PE-Cy7 FLR-A"
  cd4_threshold: 2.4
  cd8_channel: "CD8 PerCP-Cy55 FLR-A"
  cd8_threshold: 3.15